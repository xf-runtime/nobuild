<!-- templates/pages/cp_vehicle.html -->
<div class="custom-vehicle-theme">
    <style>
        /* Scoped custom styling specifically for the Vehicle page */
        .custom-vehicle-theme {
            background-color: #e9ecef; /* Light grey background */
            min-height: 100%;
            padding: 1.5rem;
            border-radius: 0.5rem;
        }

            .custom-vehicle-theme .vehicle-title {
                color: #004080; /* Blue font */
                font-weight: 700;
                letter-spacing: -0.01em;
            }
    </style>

    <!-- Custom Action Toolbar -->
    <div class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom border-secondary-subtle">
        <div class="px-2">
            <!-- Utilizing xfvue data binding directly in the custom layout -->
            <span class="fs-2 vehicle-title">
                <i class="ph ph-truck me-2"></i>{{ xz.xf_entityhdr }}
            </span>
        </div>

        <div class="d-flex align-items-center p-1 gap-2">
            <!-- Custom Page-Specific Action Call -->
            <div v-if="F.cp_vehicle" class="btn btn-icon btn-sm btn-warning" @click="F.cp_vehicle.calculateTireStatus(xz.xf_id)" title="Run Diagnostics">
                <i class="ph ph-gear"></i>
            </div>

            <!-- Refresh Action -->
            <div class="btn btn-icon btn-sm btn-light btn-active-secondary" @click="refresh()" title="Refresh">
                <i class="ph ph-arrows-clockwise"></i>
            </div>

            <!-- Save Action -->
            <div v-if="xz.xf_id > 0" class="btn btn-icon btn-success px-2 py-0 rounded-pill" @click="xpost()" v-show="xz.xf_r<4" title="Save">
                <i class="ph-bold ph-check fs-5"></i>
            </div>

            <!-- Create Action -->
            <div v-if="xz.xf_id < 0" class="btn btn-icon btn-success btn-active-secondary" @click="xpost()" v-show="xz.xf_r<4" title="Create">
                <i class="ph-bold ph-plus fs-5"></i>
            </div>

            <!-- Close Action -->
            <div class="btn btn-light px-2 py-0 rounded-pill" v-on:click="close('#page/landing')" title="Close">
                <i class="ph-bold ph-x fs-5 text-danger"></i>
            </div>
        </div>
    </div>

    <!-- Grid Injection Target -->
    <div class="row">
        <!-- SECTIONS AND COMPONENTS INJECTED HERE -->
    </div>
</div>
